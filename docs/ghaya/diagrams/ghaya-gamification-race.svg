<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" role="img" aria-label="Two concurrent requests; UNIQUE constraint rejects duplicate completion">
  <rect x="30" y="50" width="80" height="36" rx="4" fill="#e8f0f8" stroke="#0f3a5f"/>
  <text x="70" y="73" text-anchor="middle" font-size="11" font-family="Archivo,sans-serif">Req A</text>
  <rect x="30" y="100" width="80" height="36" rx="4" fill="#e8f0f8" stroke="#0f3a5f"/>
  <text x="70" y="123" text-anchor="middle" font-size="11" font-family="Archivo,sans-serif">Req B</text>
  <rect x="240" y="70" width="120" height="48" rx="4" fill="#0f3a5f"/>
  <text x="300" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#d6e6f3" font-family="Archivo,sans-serif">PostgreSQL</text>
  <line x1="110" y1="68" x2="238" y2="88" stroke="#0f3a5f"/>
  <line x1="110" y1="118" x2="238" y2="100" stroke="#0f3a5f"/>
  <text x="150" y="82" font-size="9" font-family="IBM Plex Mono,monospace" fill="#4a5c6a">check + insert</text>
  <rect x="420" y="55" width="120" height="78" rx="4" fill="#fff8e1" stroke="#e9b824"/>
  <text x="480" y="85" text-anchor="middle" font-size="10" font-family="IBM Plex Mono,monospace" fill="#3d3208">UNIQUE</text>
  <text x="480" y="102" text-anchor="middle" font-size="10" font-family="IBM Plex Mono,monospace" fill="#3d3208">(user_id,</text>
  <text x="480" y="118" text-anchor="middle" font-size="10" font-family="IBM Plex Mono,monospace" fill="#3d3208">task_id)</text>
  <line x1="360" y1="94" x2="418" y2="94" stroke="#e9b824" stroke-width="2"/>
</svg>
