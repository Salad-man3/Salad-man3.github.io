<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Learn screen calls drop from about five to two with aggregation and Redis">
  <text x="20" y="24" font-family="Archivo,sans-serif" font-size="14" font-weight="700" fill="#14202b">Before</text>
  <text x="380" y="24" font-family="Archivo,sans-serif" font-size="14" font-weight="700" fill="#14202b">After</text>
  <rect x="20" y="40" width="90" height="32" rx="4" fill="#e8f0f8" stroke="#0f3a5f"/>
  <text x="65" y="61" text-anchor="middle" font-size="11" font-family="Archivo,sans-serif">Mobile</text>
  <rect x="200" y="40" width="90" height="32" rx="4" fill="#0f3a5f"/>
  <text x="245" y="61" text-anchor="middle" font-size="11" fill="#d6e6f3" font-family="Archivo,sans-serif">API</text>
  <line x1="110" y1="56" x2="198" y2="56" stroke="#0f3a5f" stroke-width="1.5"/>
  <text x="130" y="50" font-size="9" fill="#4a5c6a" font-family="IBM Plex Mono,monospace">progress</text>
  <line x1="110" y1="72" x2="198" y2="72" stroke="#0f3a5f" stroke-width="1.5"/>
  <text x="130" y="86" font-size="9" fill="#4a5c6a" font-family="IBM Plex Mono,monospace">modules + 2 more</text>
  <rect x="380" y="40" width="90" height="32" rx="4" fill="#e8f0f8" stroke="#0f3a5f"/>
  <text x="425" y="61" text-anchor="middle" font-size="11" font-family="Archivo,sans-serif">Mobile</text>
  <rect x="560" y="40" width="90" height="32" rx="4" fill="#0f3a5f"/>
  <text x="605" y="61" text-anchor="middle" font-size="11" fill="#d6e6f3" font-family="Archivo,sans-serif">API</text>
  <rect x="560" y="90" width="90" height="32" rx="4" fill="#f2f5f7" stroke="#0f3a5f"/>
  <text x="605" y="111" text-anchor="middle" font-size="11" font-family="Archivo,sans-serif">Redis</text>
  <line x1="470" y1="56" x2="558" y2="56" stroke="#e9b824" stroke-width="2.5"/>
  <text x="480" y="50" font-size="9" fill="#3d3208" font-family="IBM Plex Mono,monospace">GET /users/me/learn</text>
  <line x1="605" y1="72" x2="605" y2="88" stroke="#0f3a5f" stroke-width="1.5"/>
  <text x="380" y="150" font-family="Archivo,sans-serif" font-size="12" fill="#4a5c6a">~5 calls → ~2 calls (aggregated payload + 30s cache)</text>
